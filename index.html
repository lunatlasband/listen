<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LunAtlas — Céleste</title>
  <meta name="description" content="Céleste, the debut EP by LunAtlas. Listen now on Spotify, YouTube Music, Apple Music or Deezer." />
  <meta name="theme-color" content="#07131f" />
  <meta property="og:title" content="LunAtlas — Céleste" />
  <meta property="og:description" content="Out now" />
  <meta property="og:type" content="music.album" />
  <meta property="og:image" content="celeste-web.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Meta Pixel -->
  <script>

  <style>
    :root {
      --ink: #07131f;
      --ink-2: #0b1d2d;
      --paper: #f5f7f7;
      --muted: rgba(245,247,247,.66);
      --line: rgba(255,255,255,.16);
      --surface: rgba(7,19,31,.68);
      --surface-hover: rgba(12,30,46,.88);
      --accent: #8bb9d5;
      --shadow: 0 20px 60px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }

    html {
      margin: 0;
      min-height: 100%;
      background: var(--ink);
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      background: transparent;
      color: var(--paper);
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -10%;
      z-index: -2;
      background:
        linear-gradient(rgba(2,7,12,.68), rgba(2,7,12,.88)),
        url("celeste-web.jpg") 50% 42% / cover no-repeat;
      filter: blur(42px) saturate(.68) brightness(.55) contrast(1.05);
      transform: scale(1.12);
      opacity: 1;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 50% 0%, rgba(120,150,180,.10), transparent 28%),
        radial-gradient(circle at 18% 48%, rgba(35,74,110,.16), transparent 34%),
        linear-gradient(to bottom, rgba(2,6,10,.18), rgba(2,6,10,.46));
      pointer-events: none;
    }

    .page {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 20px max(38px, env(safe-area-inset-bottom));
    }

    .hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      margin: 2px 0 11px;
      font-family: "Jura", sans-serif;
      font-size: 15px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: .62em;
      text-transform: uppercase;
      padding-left: .62em;
      color: rgba(245,247,247,.90);
    }

    .eyebrow {
      display: block;
      font-family: "Jura", sans-serif;
      min-height: 0;
      margin: 0 0 6px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: rgba(180,200,214,.72);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .34em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Jura", sans-serif;
      font-size: clamp(38px, 9.8vw, 54px);
      line-height: .98;
      font-weight: 500;
      letter-spacing: .28em;
      padding-left: .28em;
      text-transform: uppercase;
      text-shadow: 0 5px 34px rgba(0,0,0,.38);
    }

    .subline {
      margin: 7px 0 12px;
      font-family: "Jura", sans-serif;
      color: rgba(245,247,247,.62);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .listen-label {
      width: 100%;
      font-family: "Jura", sans-serif;
      margin: 0 0 6px;
      color: rgba(245,247,247,.82);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .platforms {
      width: 100%;
      display: grid;
      gap: 7px;
    }

    .platform {
      position: relative;
      min-height: 66px;
      width: 100%;
      display: grid;
      grid-template-columns: 38px minmax(0,1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border: 1px solid rgba(255,255,255,.21);
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0)),
        rgba(5,16,26,.78);
      box-shadow: 0 9px 30px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.025);
      color: var(--paper);
      text-decoration: none;
      text-align: left;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translateZ(0);
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .platform:first-child {
      border-color: rgba(155,204,232,.58);
      background:
        linear-gradient(180deg, rgba(139,185,213,.075), rgba(255,255,255,0)),
        rgba(5,17,28,.84);
      box-shadow: 0 11px 36px rgba(0,0,0,.22), inset 0 0 0 1px rgba(139,185,213,.06);
    }

    .platform:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .platform:active { transform: scale(.985); }

    .icon-wrap {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
    }

    .icon-wrap img {
      width: 22px;
      height: 22px;
      display: block;
    }

    .platform-name {
      min-width: 0;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .action {
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(245,247,247,.70);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .arrow {
      display: inline-block;
      font-size: 20px;
      line-height: 1;
      font-weight: 400;
      transform: translateX(0);
      transition: transform .18s ease;
    }

    .artwork-wrap {
      margin: 24px auto 0;
      width: min(78%, 340px);
    }

    .artwork {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 3px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.11);
    }

    .footer {
      margin: 22px 0 0;
      text-align: center;
      color: rgba(245,247,247,.38);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    @media (hover:hover) and (pointer:fine) {
      .platform:hover {
        transform: translateY(-3px);
        background:
          linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,0)),
          rgba(10,27,42,.92);
        border-color: rgba(190,220,237,.44);
        box-shadow: 0 15px 42px rgba(0,0,0,.27), inset 0 1px 0 rgba(255,255,255,.04);
      }

      .platform:hover .arrow { transform: translateX(4px); }
    }

    @media (min-width: 760px) {
      .page {
        width: min(100%, 560px);
        padding-top: 30px;
      }

      .brand { margin-bottom: 12px; }
      .subline { margin-bottom: 14px; }
      .platform { min-height: 68px; }
      .artwork-wrap { margin-top: 26px; }
    }

    @media (max-height: 740px) and (max-width: 600px) {
      .page { padding-top: 16px; }
      .brand { margin-bottom: 8px; }
      .eyebrow { margin-bottom: 5px; }
      h1 { font-size: 36px; letter-spacing: .24em; padding-left: .24em; }
      .subline { margin: 6px 0 10px; }
      .listen-label { margin-bottom: 5px; }
      .platforms { gap: 6px; }
      .platform { min-height: 60px; padding-top: 9px; padding-bottom: 9px; }
      .artwork-wrap { margin-top: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <noscript>

  <main class="page">
    <section class="hero" aria-labelledby="release-title">

      <div class="eyebrow">New</div>
      <h1 id="release-title">Céleste</h1>
      <p class="subline">Out now</p>

      <div class="listen-label">Listen now</div>

      <div class="platforms" aria-label="Choose a streaming platform">
        <a class="platform" href="https://open.spotify.com/intl-fr/album/6fXMnmQQDEJg6eAEZm63BC" target="_blank" rel="noopener noreferrer" data-event="Spotify_Click">
          <span class="icon-wrap"><img src="https://cdn.simpleicons.org/spotify/1ED760" alt="" /></span>
          <span class="platform-name">Spotify</span>
          <span class="action">Listen <span class="arrow" aria-hidden="true">→</span></span>
        </a>

        <a class="platform" href="https://music.youtube.com/playlist?list=OLAK5uy_lsL54icNhxJbmZalFAGaXEgBpcSnUgqkc&si=q_Kd0wi9cy4cU4vn" target="_blank" rel="noopener noreferrer" data-event="YouTube_Click">
          <span class="icon-wrap"><img src="https://cdn.simpleicons.org/youtubemusic/FF0000" alt="" /></span>
          <span class="platform-name">YouTube Music</span>
          <span class="action">Listen <span class="arrow" aria-hidden="true">→</span></span>
        </a>

        <a class="platform" href="https://music.apple.com/us/album/c%C3%A9leste-ep/6794076441" target="_blank" rel="noopener noreferrer" data-event="AppleMusic_Click">
          <span class="icon-wrap"><img src="https://cdn.simpleicons.org/applemusic/FA243C" alt="" /></span>
          <span class="platform-name">Apple Music</span>
          <span class="action">Listen <span class="arrow" aria-hidden="true">→</span></span>
        </a>

        <a class="platform" href="https://www.deezer.com/en/album/1036475892" target="_blank" rel="noopener noreferrer" data-event="Deezer_Click">
          <span class="icon-wrap"><img src="https://cdn.simpleicons.org/deezer/A238FF" alt="" /></span>
          <span class="platform-name">Deezer</span>
          <span class="action">Listen <span class="arrow" aria-hidden="true">→</span></span>
        </a>
      </div>

      <figure class="artwork-wrap">
        <img class="artwork" src="celeste-web.jpg" alt="Céleste — LunAtlas EP artwork" />
      </figure>

      <div class="footer">LunAtlas · Geneva</div>
    </section>
  </main>

  <script>
    document.querySelectorAll('[data-event]').forEach(function(link) {
      link.addEventListener('click', function() {
        if (typeof fbq === 'function') {
          fbq('trackCustom', link.dataset.event);
          fbq('trackCustom', 'MusicPlatformClick', {
            platform: link.querySelector('.platform-name')?.textContent || ''
          });
        }
      });
    });
  </script>
</body>
</html>
